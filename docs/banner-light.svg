  <linearGradient id="bl-bar" x1="16" y1="21" x2="44" y2="21" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14D4BE"/><stop offset="1" stop-color="#38BAF5"/></linearGradient>
  <linearGradient id="bl-glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14D4BE" stop-opacity="0"/><stop offset="0.5" stop-color="#14D4BE" stop-opacity="0.35"/><stop offset="1" stop-color="#14D4BE" stop-opacity="0"/></linearGradient>
