  <path d="M24 21 V45" fill="none" stroke="#9066F5" stroke-width="8" stroke-linecap="round"/>
  <path d="M38 21 V40 Q38 46 43.5 46" fill="none" stroke="#F040B5" stroke-width="8" stroke-linecap="round"/>
