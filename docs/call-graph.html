<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPaiOS — Function Call Graph</title>
<style>
:root {
  --bg:       #07090F;
  --surf:     #0E1420;
  --panel:    #131C2E;
  --border:   rgba(255,255,255,0.08);
  --head:     #14D4BE;
  --text:     #C8D4E8;
  --muted:    #5A6A88;
  --hover:    #1A2540;
  --chat:     #FF5758;
  --research: #14D4BE;
  --crew:     #9066F5;
  --media:    #F5A623;
  --email:    #38BAF5;
  --docs:     #5ECF8A;
  --auth:     #FF4FCA;
  --models:   #F0B866;
  --system:   #6680A8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
}

.hdr {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0 1.1rem;
  height: 52px;
  display: flex;
  align-items: center;
  gap: .9rem;
  flex-shrink: 0;
  z-index: 50;
}
.hdr-logo { display: flex; align-items: center; gap: .5rem; font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; }
.hdr-logo .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--head); }
.hdr-sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

.search-wrap { position: relative; flex-shrink: 0; }
.search-input {
  width: 220px;
  background: var(--hover);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: .38rem .6rem .38rem 1.8rem;
  color: var(--text);
  font-size: 12px;
  outline: none;
  transition: border-color .15s;
}
.search-input:focus { border-color: var(--head); }
.search-icon { position: absolute; left: .55rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }
.search-count { font-size: 10.5px; color: var(--muted); white-space: nowrap; }

.hdr-btn {
  padding: .32rem .65rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.hdr-btn:hover { border-color: rgba(255,255,255,.22); color: var(--text); }

.hdr-stats { margin-left: auto; display: flex; gap: 1.1rem; flex-shrink: 0; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat-n { font-size: 14px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.main { flex: 1; position: relative; overflow: hidden; min-height: 0; }
#canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#canvas.dragging { cursor: grabbing; }

.hint {
  position: absolute;
  bottom: 14px;
  left: 14px;
  font-size: 10.5px;
  color: var(--muted);
  background: rgba(14,20,32,.75);
  backdrop-filter: blur(6px);
  padding: .4rem .6rem;
  border-radius: 7px;
  border: 1px solid var(--border);
  line-height: 1.6;
  pointer-events: none;
  z-index: 20;
}
.hint b { color: var(--text); }

/* legend */
.legend {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(14,20,32,.8);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: .55rem .7rem;
  display: flex;
  flex-direction: column;
  gap: .32rem;
  z-index: 20;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: .4rem;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  padding: .1rem .2rem;
  border-radius: 4px;
  transition: all .15s;
  user-select: none;
}
.leg-item:hover { background: rgba(255,255,255,.05); color: var(--text); }
.leg-item.dimmed { opacity: .35; }
.leg-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.leg-n { margin-left: auto; font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: .5rem; }

/* side panel */
.side-panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 300px;
  background: rgba(19,28,46,.92);
  backdrop-filter: blur(10px);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform .22s ease;
  z-index: 30;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-panel.open { transform: translateX(0); }
.panel-top {
  padding: .9rem 1rem .7rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: .5rem;
}
.panel-pip { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.panel-titles { flex: 1; min-width: 0; }
.panel-name { font-weight: 700; font-size: 14px; color: #fff; font-family: 'SF Mono', 'Fira Code', monospace; word-break: break-all; }
.panel-dir { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: 'SF Mono', 'Fira Code', monospace; }
.panel-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px; flex-shrink: 0; }
.panel-close:hover { color: var(--text); }
.panel-body { flex: 1; overflow-y: auto; padding: .8rem 1rem; scrollbar-width: thin; }
.panel-meta { display: flex; gap: 1.2rem; margin-bottom: .8rem; padding-bottom: .7rem; border-bottom: 1px solid var(--border); }
.pm-item { display: flex; flex-direction: column; }
.pm-n { font-size: 16px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.pm-l { font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.panel-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .4rem; }
.conn-list { display: flex; flex-direction: column; gap: .28rem; }
.conn-item {
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: .34rem .5rem;
  border-radius: 6px;
  background: var(--hover);
  cursor: pointer;
  transition: background .15s;
  font-size: 11px;
}
.conn-item:hover { background: rgba(255,255,255,.07); }
.conn-pip { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.conn-name { font-family: 'SF Mono', 'Fira Code', monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.conn-w { font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.credit {
  position: absolute;
  bottom: 14px;
  right: 14px;
  font-size: 10.5px;
  color: var(--muted);
  background: rgba(14,20,32,.75);
  backdrop-filter: blur(6px);
  padding: .4rem .65rem;
  border-radius: 7px;
  border: 1px solid var(--border);
  z-index: 20;
}
.credit a { color: var(--head); text-decoration: none; }
.credit a:hover { text-decoration: underline; }

@media (max-width: 640px) {
  .legend { display: none; }
  .search-input { width: 140px; }
  .side-panel { width: 100%; }
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo"><span class="dot"></span>MyPaiOS · Call Graph</div>
  <div class="hdr-sep"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="search" placeholder="Find a function…" autocomplete="off">
  </div>
  <span class="search-count" id="search-count"></span>
  <button class="hdr-btn" id="resettle-btn">↻ Re-settle</button>
  <button class="hdr-btn" id="reset-view-btn">⤢ Fit view</button>
  <div class="hdr-stats">
    <div class="stat"><span class="stat-n" id="stat-nodes">0</span><span class="stat-l">functions</span></div>
    <div class="stat"><span class="stat-n" id="stat-edges">0</span><span class="stat-l">calls</span></div>
  </div>
</header>

<div class="main">
  <canvas id="canvas"></canvas>

  <div class="legend" id="legend"></div>

  <div class="hint"><b>Drag</b> a node to pin it · <b>Scroll</b> to zoom · <b>Drag</b> background to pan · <b>Click</b> a node for details</div>

  <div class="credit">
    Call graph extracted locally from <a href="https://github.com/colbymchenry/codegraph" target="_blank" rel="noopener">CodeGraph</a> (Rust kernel, MIT) · 50,699 call edges resolved · no LLM calls
  </div>

  <div class="side-panel" id="side-panel">
    <div class="panel-top">
      <div class="panel-pip" id="panel-pip"></div>
      <div class="panel-titles">
        <div class="panel-name" id="panel-name"></div>
        <div class="panel-dir" id="panel-dir"></div>
      </div>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body">
      <div class="panel-meta">
        <div class="pm-item"><span class="pm-n" id="pm-degree">0</span><span class="pm-l">connections</span></div>
        <div class="pm-item"><span class="pm-n" id="pm-domain">—</span><span class="pm-l">domain</span></div>
      </div>
      <div class="panel-section-title">Callers &amp; callees</div>
      <div class="conn-list" id="conn-list"></div>
    </div>
  </div>
</div>

// ── Build adjacency ─────────────────────────────────────
const nodeById = {};
GRAPH.nodes.forEach(n => { nodeById[n.id] = n; n.neighbors = []; });
GRAPH.edges.forEach(e => {
  const s = nodeById[e.s], t = nodeById[e.t];
  if (!s || !t) return;
  s.neighbors.push({ id: e.t, w: e.w });
  t.neighbors.push({ id: e.s, w: e.w });
});

const maxDeg = Math.max(...GRAPH.nodes.map(n => n.deg));
GRAPH.nodes.forEach(n => {
  n.r = 3.2 + Math.sqrt(n.deg / maxDeg) * 15;
  n.x = (Math.random() - 0.5) * 900;
  n.y = (Math.random() - 0.5) * 900;
  n.vx = 0; n.vy = 0;
  n.fixed = false;
});

document.getElementById('stat-nodes').textContent = GRAPH.nodes.length;
document.getElementById('stat-edges').textContent = GRAPH.edges.length;

// ── Legend ──────────────────────────────────────────────
const legendEl = document.getElementById('legend');
const domainCounts = {};
GRAPH.nodes.forEach(n => { domainCounts[n.domain] = (domainCounts[n.domain]||0) + 1; });
let dimmedDomains = new Set();

Object.keys(COLORS).forEach(key => {
  if (!domainCounts[key]) return;
  const el = document.createElement('div');
  el.className = 'leg-item';
  el.dataset.domain = key;
  el.innerHTML = `<span class="leg-pip" style="background:${COLORS[key]}"></span>${DOMAIN_LABELS[key]}<span class="leg-n">${domainCounts[key]}</span>`;
  el.onclick = () => {
    if (dimmedDomains.has(key)) dimmedDomains.delete(key); else dimmedDomains.add(key);
    el.classList.toggle('dimmed');
  };
  legendEl.appendChild(el);
});

// ── Canvas setup ─────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

let camX = 0, camY = 0, camScale = 1;

function worldToScreen(x, y) { return [ (x - camX) * camScale + W/2, (y - camY) * camScale + H/2 ]; }
function screenToWorld(x, y) { return [ (x - W/2) / camScale + camX, (y - H/2) / camScale + camY ]; }

// ── Physics ──────────────────────────────────────────────
let simTicks = 0;
const MAX_TICKS = 480;
let simActive = true;

function step() {
  if (!simActive) return;
  const nodes = GRAPH.nodes;
  const REPEL = 2600;
  const CENTER_K = 0.0009;
  const LINK_K = 0.045;

  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.fixed) continue;
    let fx = -a.x * CENTER_K, fy = -a.y * CENTER_K;
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) d2 = 1;
      const d = Math.sqrt(d2);
      const f = REPEL / d2;
      fx += (dx/d) * f;
      fy += (dy/d) * f;
    }
    a.fx = fx; a.fy = fy;
  }

  GRAPH.edges.forEach(e => {
    const a = nodeById[e.s], b = nodeById[e.t];
    if (!a || !b) return;
    const rest = 70 - Math.min(e.w, 20) * 1.6;
    let dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = (d - Math.max(rest, 18)) * LINK_K;
    const fx = (dx/d) * f, fy = (dy/d) * f;
    if (!a.fixed) { a.fx += fx; a.fy += fy; }
    if (!b.fixed) { b.fx -= fx; b.fy -= fy; }
  });

  const damping = 0.82;
  nodes.forEach(n => {
    if (n.fixed) { n.vx = 0; n.vy = 0; return; }
    n.vx = (n.vx + n.fx * 0.02) * damping;
    n.vy = (n.vy + n.fy * 0.02) * damping;
    n.x += n.vx;
    n.y += n.vy;
  });

  simTicks++;
  if (simTicks > MAX_TICKS) simActive = false;
}

// ── Rendering ─────────────────────────────────────────────
let hoveredNode = null;
let selectedNode = null;
let searchMatches = new Set();

function highlightSet() {
  if (hoveredNode) {
    const s = new Set([hoveredNode.id]);
    hoveredNode.neighbors.forEach(nb => s.add(nb.id));
    return s;
  }
  if (selectedNode) {
    const s = new Set([selectedNode.id]);
    selectedNode.neighbors.forEach(nb => s.add(nb.id));
    return s;
  }
  return null;
}

function draw() {

  ctx.fillStyle = '#07090F';

    ctx.lineWidth = Math.min(0.4 + e.w * 0.12, 2.6) * (dim ? 0.6 : 1);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
  });

    const dimByDomain = dimmedDomains.has(n.domain);
    const dimByHl = hl && !hl.has(n.id);

    const dim = dimByDomain || dimByHl || dimBySearch;

    const [sx, sy] = worldToScreen(n.x, n.y);
    if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) return;
    const r = n.r * camScale;
    const color = COLORS[n.domain] || '#6680A8';

    ctx.globalAlpha = dim ? 0.12 : 1;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(r, 1.6), 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();

    if (n === selectedNode || n === hoveredNode) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }

    if (!dim && (r > 7 || n === hoveredNode || n === selectedNode) && camScale > 0.35) {
      ctx.globalAlpha = 1;
      ctx.font = `${Math.min(11, 9 + r*0.15)}px -apple-system, sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.textAlign = 'center';
      ctx.fillText(n.name, sx, sy - r - 5);
    }
    ctx.globalAlpha = 1;
  });
}

function loop() {
  step();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ── Interaction ──────────────────────────────────────────
function nodeAtScreen(sx, sy) {
  let best = null, bestD = Infinity;
  for (const n of GRAPH.nodes) {
    const [x, y] = worldToScreen(n.x, n.y);
    const d = Math.hypot(x - sx, y - sy);
    const r = Math.max(n.r * camScale, 5);
    if (d < r && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

let dragging = null, panning = false, lastMouse = [0,0], moved = false;

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const n = nodeAtScreen(sx, sy);
  moved = false;
  if (n) {
    dragging = n;
    n.fixed = true;
    simActive = true; simTicks = Math.max(simTicks, MAX_TICKS - 60);
  } else {
    panning = true;
    canvas.classList.add('dragging');
  }
  lastMouse = [e.clientX, e.clientY];
});

window.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const dx = e.clientX - lastMouse[0], dy = e.clientY - lastMouse[1];
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;

  if (dragging) {
    const [wx, wy] = screenToWorld(sx, sy);
    dragging.x = wx; dragging.y = wy;
  } else if (panning) {
    camX -= dx / camScale;
    camY -= dy / camScale;
  } else {
    const n = nodeAtScreen(sx, sy);
    if (n !== hoveredNode) { hoveredNode = n; canvas.style.cursor = n ? 'pointer' : 'grab'; }
  }
  lastMouse = [e.clientX, e.clientY];
});

window.addEventListener('mouseup', () => {
  dragging = null;
  panning = false;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('click', e => {
  if (moved) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const n = nodeAtScreen(sx, sy);
  if (n) selectNode(n); else closePanel();
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const [wx, wy] = screenToWorld(sx, sy);
  const delta = -e.deltaY * 0.0011;
  camScale = Math.min(4, Math.max(0.08, camScale * (1 + delta)));
  const [nx, ny] = screenToWorld(sx, sy);
  camX += (wx - nx);
  camY += (wy - ny);
}, { passive: false });

// ── Side panel ───────────────────────────────────────────
function selectNode(n) {
  selectedNode = n;
  document.getElementById('panel-pip').style.background = COLORS[n.domain] || '#6680A8';
  document.getElementById('panel-name').textContent = n.name;
  document.getElementById('panel-dir').textContent = n.id;
  document.getElementById('pm-degree').textContent = n.deg;
  document.getElementById('pm-domain').textContent = DOMAIN_LABELS[n.domain] || n.domain;

  const list = document.getElementById('conn-list');
  const sorted = [...n.neighbors].sort((a,b) => b.w - a.w).slice(0, 40);
  list.innerHTML = sorted.map(nb => {
    const target = nodeById[nb.id];
    if (!target) return '';
    return `<div class="conn-item" data-id="${nb.id}">
      <span class="conn-pip" style="background:${COLORS[target.domain]||'#6680A8'}"></span>
      <span class="conn-name">${target.id}</span>
      <span class="conn-w">${nb.w}</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.conn-item').forEach(el => {
    el.onclick = () => { const t = nodeById[el.dataset.id]; if (t) selectNode(t); };
  });

  document.getElementById('side-panel').classList.add('open');
}
function closePanel() {
  selectedNode = null;
  document.getElementById('side-panel').classList.remove('open');
}

// ── Search ────────────────────────────────────────────────
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchMatches = new Set(); document.getElementById('search-count').textContent = ''; return; }
  searchMatches = new Set(GRAPH.nodes.filter(n => n.name.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)).map(n => n.id));
  document.getElementById('search-count').textContent = searchMatches.size + ' match' + (searchMatches.size===1?'':'es');
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && searchMatches.size) {
    const first = GRAPH.nodes.find(n => searchMatches.has(n.id));
    if (first) { selectNode(first); camX = first.x; camY = first.y; camScale = Math.max(camScale, 1.1); }
  }
});

// ── Buttons ──────────────────────────────────────────────
document.getElementById('resettle-btn').onclick = () => {
  GRAPH.nodes.forEach(n => {
    n.fixed = false;
    n.x = (Math.random()-0.5) * 900;
    n.y = (Math.random()-0.5) * 900;
    n.vx = 0; n.vy = 0;
  });
  simTicks = 0; simActive = true;
};
document.getElementById('reset-view-btn').onclick = () => { camX = 0; camY = 0; camScale = 0.55; };
camScale = 0.55;

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
